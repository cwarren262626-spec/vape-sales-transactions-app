<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>KuslagVape — Sales Transactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-view">
  <div class="login-card">
    <div class="brand-mark">KUSLAGVAPE</div>
    <h1>Sign In</h1>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <p class="error-text" id="login-error"></p>
      <button type="submit" class="btn btn-primary" id="login-submit">Sign In</button>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div>
      <div class="title">Sales Transactions</div>
      <div class="subtitle" id="current-email"></div>
    </div>
    <button class="btn btn-ghost btn-sm" id="sign-out-btn">Sign Out</button>
  </header>

  <main class="screen">

    <!-- New Transaction -->
    <section id="screen-new">
      <div class="card">
        <h2>New Transaction</h2>
        <div id="tx-product-box"></div>

        <form id="tx-form">
          <div id="tx-form-fields">
            <div class="field searchable">
              <label for="product-search">Product</label>
              <input type="text" id="product-search" placeholder="Search products…" autocomplete="off" />
              <div id="product-results" class="searchable-results hidden"></div>
            </div>
            <p class="muted hidden" id="tx-stock-line" style="margin: -6px 0 14px 0;"></p>

            <div class="field">
              <label for="tx-quantity">Quantity</label>
              <input type="number" id="tx-quantity" min="1" inputmode="numeric" />
            </div>

            <div class="field">
              <label for="tx-amount">Amount (₱)</label>
              <input type="number" id="tx-amount" min="0" step="0.01" inputmode="decimal" />
            </div>

            <div class="field">
              <label for="tx-remarks">Remarks (optional)</label>
              <textarea id="tx-remarks" rows="2"></textarea>
            </div>

            <p class="error-text" id="tx-error"></p>
            <button type="submit" class="btn btn-primary" id="tx-save-btn" disabled>Save</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Transactions -->
    <section id="screen-transactions" class="hidden">
      <div id="tx-list"></div>
    </section>

    <!-- Products -->
    <section id="screen-products" class="hidden">
      <div class="row-between" style="margin-bottom:12px;">
        <h2 style="margin:0;font-size:18px;">Product List</h2>
        <span class="stat-num" id="product-total-stock"></span>
      </div>

      <div class="field hidden">
        <label for="brand-filter">Filter by brand</label>
        <select id="brand-filter"></select>
      </div>

      <p class="muted" id="product-count" style="margin-bottom:12px;"></p>

      <button class="btn btn-ghost hidden" id="report-btn" style="margin-bottom:14px;">Generate Report</button>

      <div id="product-list"></div>
    </section>

  </main>

  <button class="fab hidden" id="add-product-fab" title="Add product">+</button>

  <nav class="bottom-tabs">
    <button data-tab="new" class="active"><span class="icon">＋</span>New Transaction</button>
    <button data-tab="transactions"><span class="icon">📋</span>Transactions</button>
    <button data-tab="products" id="admin-only-nav"><span class="icon">📦</span>Products</button>
  </nav>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
