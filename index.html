<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Kuslag Vape Shop — Sales Transactions</title>
<link rel="icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-view">
  <div class="login-card">
    <img src="logo.png" alt="Kuslag Vape Shop" class="brand-logo" />
    <h1>Sign in</h1>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <p class="error-text" id="login-error"></p>
      <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="title-group">
      <div class="avatar" id="user-avatar">–</div>
      <div>
        <div class="title">Sales Transactions</div>
        <div class="subtitle-row">
          <span class="subtitle" id="current-email"></span>
          <span class="role-chip hidden" id="role-chip">ADMIN</span>
        </div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="sign-out-btn">Sign out</button>
    </div>
  </header>

  <main class="screen">

    <!-- New Transaction -->
    <section id="screen-new">
      <div class="card">
        <h2>New transaction</h2>
        <div id="tx-product-box"></div>

        <form id="tx-form">
          <div id="tx-form-fields">
            <div class="field searchable">
              <label for="product-search">Product</label>
              <input type="text" id="product-search" placeholder="Search products…" autocomplete="off" />
              <div id="product-results" class="searchable-results hidden"></div>
            </div>
            <p class="muted hidden" id="tx-stock-line" style="margin: -6px 0 14px 0;"></p>

            <div class="field">
              <label for="tx-quantity">Quantity</label>
              <input type="number" id="tx-quantity" min="1" inputmode="numeric" />
            </div>

            <div class="field">
              <label for="tx-amount">Amount (₱)</label>
              <input type="number" id="tx-amount" min="0" step="0.01" inputmode="decimal" />
            </div>

            <div class="field">
              <label for="tx-remarks">Remarks (optional)</label>
              <textarea id="tx-remarks" rows="2"></textarea>
            </div>

            <p class="error-text" id="tx-error"></p>
            <button type="submit" class="btn btn-primary" id="tx-save-btn" disabled>Save</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Transactions -->
    <section id="screen-transactions" class="hidden">
      <div class="filters-row">
        <div class="field">
          <label for="user-filter">Filter by user</label>
          <select id="user-filter">
            <option value="">All users</option>
          </select>
        </div>
        <div class="field">
          <label for="date-from">From date</label>
          <input type="date" id="date-from" />
        </div>
        <div class="field">
          <label for="date-to">To date</label>
          <input type="date" id="date-to" />
        </div>
      </div>
      <div class="filter-chips">
        <button type="button" class="chip-btn" data-range="today">Today</button>
        <button type="button" class="chip-btn" data-range="7">Last 7 days</button>
        <button type="button" class="chip-btn" data-range="30">Last 30 days</button>
        <button type="button" class="chip-btn" data-range="month">This month</button>
        <button type="button" class="chip-btn chip-clear" data-range="all">All time</button>
      </div>
      <p class="muted" id="tx-count" style="margin-bottom:12px;"></p>
      <div id="tx-list"></div>
      <div id="tx-pagination"></div>
    </section>

    <!-- Products -->
    <section id="screen-products" class="hidden">
      <div class="row-between" style="margin-bottom:12px;">
        <h2 style="margin:0;font-size:15px;font-weight:600;">Product list</h2>
        <span class="stat-num" id="product-total-stock"></span>
      </div>

      <div class="filters-row">
        <div class="field hidden" id="brand-filter-wrap">
          <label for="brand-filter">Filter by brand</label>
          <select id="brand-filter"></select>
        </div>
      </div>

      <p class="muted" id="product-count" style="margin-bottom:12px;"></p>

      <button class="btn btn-ghost hidden" id="report-btn" style="margin-bottom:14px;">Generate report</button>

      <div id="product-list"></div>
    </section>

    <!-- Dashboard (admin only) -->
    <section id="screen-dashboard" class="hidden">
      <div class="row-between" style="margin-bottom:14px;">
        <h2 style="margin:0;font-size:15px;font-weight:600;">Dashboard</h2>
        <span class="stat-num" id="dashboard-updated"></span>
      </div>
      <div id="dashboard-content"><p class="muted">Loading…</p></div>
    </section>

    <!-- Users (admin only) -->
    <section id="screen-users" class="hidden">
      <div class="row-between" style="margin-bottom:12px;">
        <h2 style="margin:0;font-size:15px;font-weight:600;">User management</h2>
      </div>
      <p class="muted" id="user-count" style="margin-bottom:12px;"></p>
      <div id="user-list"></div>
    </section>

  </main>

  <button class="fab hidden" id="add-product-fab" title="Add product">+</button>
  <button class="fab hidden" id="add-user-fab" title="Add user">+</button>

  <nav class="bottom-tabs">
    <div class="sidebar-brand"><img src="logo.png" alt="" class="sidebar-brand-logo" />KUSLAG VAPE SHOP</div>
    <button data-tab="new" class="active">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      New sale
    </button>
    <button data-tab="transactions">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
      Transactions
    </button>
    <button data-tab="products" id="products-nav">
      <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Products
    </button>
    <button data-tab="dashboard" id="dashboard-nav" class="hidden">
      <svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M4 19h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Dashboard
    </button>
    <button data-tab="users" id="users-nav" class="hidden">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-6.4 7-6.4s7 2.8 7 6.4" stroke-linecap="round"/></svg>
      Users
    </button>
    <button id="sidebar-signout-btn" class="sidebar-signout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sign out
    </button>
  </nav>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
